<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danger-Khan Weather Station</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0e14; 
            color: #e5e7eb; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #151d2a;
            padding: 18px 24px;
            border-radius: 10px;
            margin-bottom: 24px;
            border: 1px solid #263347;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .title { font-size: 18px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }
        
        .status-badge {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .online { background: #064e3b; color: #34d399; border: 1px solid #047857; }
        .offline { background: #7f1d1d; color: #f87171; border: 1px solid #991b1b; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .card {
            background: #151d2a;
            border: 1px solid #263347;
            border-radius: 10px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .label-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .label { font-size: 13px; color: #9ca3af; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
        .val { font-size: 58px; font-weight: 800; font-family: monospace; margin: 16px 0; }
        .temp { color: #f97316; }
        .humid { color: #38bdf8; }
        .unit { font-size: 24px; color: #6b7280; font-weight: 400; }
        .footer-note { font-size: 12px; color: #6b7280; border-top: 1px solid #263347; padding-top: 12px; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
    <!-- Paho MQTT WebSockets Engine -->
   <script>
    const MQTT_TOPIC = "Danger-Khan/Weather-Station/telemetry"; 
    const statusBadge = document.getElementById('status');

    // Random Client ID to prevent broker disconnect collisions
    const clientID = "web_hmi_" + Math.random().toString(16).substr(2, 8);
    
    // Explicitly define Broker, WSS Port 8884, and Path "/mqtt"
    const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "/mqtt", clientID);

    client.onConnectionLost = (responseObject) => {
        console.warn("MQTT Lost Connection:", responseObject.errorMessage);
        statusBadge.innerText = "CLOUD DISCONNECTED";
        statusBadge.className = "status-badge offline";
        setTimeout(connectMQTT, 3000);
    };

    client.onMessageArrived = (message) => {
        try {
            const data = JSON.parse(message.payloadString);
            if (data.temperature !== undefined) {
                document.getElementById('temp-val').innerText = data.temperature;
            }
            if (data.humidity !== undefined) {
                document.getElementById('humid-val').innerText = data.humidity;
            }
        } catch (e) {
            console.error("Payload parse error:", e);
        }
    };

    function connectMQTT() {
        statusBadge.innerText = "CONNECTING TO CLOUD...";
        statusBadge.className = "status-badge offline";

        client.connect({
            useSSL: true,
            timeout: 5,
            keepAliveInterval: 30,
            onSuccess: () => {
                console.log("Successfully connected to HiveMQ WSS");
                statusBadge.innerText = "LIVE CLOUD LINK ONLINE";
                statusBadge.className = "status-badge online";
                client.subscribe(MQTT_TOPIC);
            },
            onFailure: (err) => {
                console.error("MQTT Connection Failed:", err);
                statusBadge.innerText = "CONNECTION FAILED - RETRYING";
                statusBadge.className = "status-badge offline";
                setTimeout(connectMQTT, 5000);
            }
        });
    }

    connectMQTT();
</script>

</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title">DANGER-KHAN WEATHER STATION</div>
            <div id="status" class="status-badge offline">CONNECTING TO CLOUD...</div>
        </div>

        <div class="grid">
            <!-- Temperature Card -->
            <div class="card">
                <div class="label-row">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
                    <span class="label">Temperature</span>
                </div>
                <div class="val temp"><span id="temp-val">--</span><span class="unit"> °C</span></div>
                <div class="footer-note">Sensor: DHT11 &bull; Pin: D4</div>
            </div>

            <!-- Humidity Card -->
            <div class="card">
                <div class="label-row">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                    <span class="label">Humidity</span>
                </div>
                <div class="val humid"><span id="humid-val">--</span><span class="unit"> %</span></div>
                <div class="footer-note">Topic: Danger-Khan/Weather-Station/telemetry</div>
            </div>
        </div>
    </div>

    <script>
        const MQTT_TOPIC = "Danger-Khan/Weather-Station/telemetry"; 
        const statusBadge = document.getElementById('status');

        // Connect to HiveMQ Public Broker over WebSockets
        const clientID = "web_hmi_" + Math.random().toString(16).substr(2, 8);
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8000, clientID);

        client.onConnectionLost = (responseObject) => {
            statusBadge.innerText = "CLOUD DISCONNECTED";
            statusBadge.className = "status-badge offline";
            setTimeout(connectMQTT, 3000);
        };

        client.onMessageArrived = (message) => {
            try {
                const data = JSON.parse(message.payloadString);
                document.getElementById('temp-val').innerText = data.temperature;
                document.getElementById('humid-val').innerText = data.humidity;
            } catch (e) {
                console.error("Payload error:", e);
            }
        };

        function connectMQTT() {
            statusBadge.innerText = "CONNECTING...";
            client.connect({
                onSuccess: () => {
                    statusBadge.innerText = "LIVE CLOUD LINK ONLINE";
                    statusBadge.className = "status-badge online";
                    client.subscribe(MQTT_TOPIC);
                },
                onFailure: (err) => {
                    statusBadge.innerText = "CONNECTION FAILED";
                    statusBadge.className = "status-badge offline";
                    setTimeout(connectMQTT, 5000);
                }
            });
        }

        connectMQTT();
    </script>
</body>
</html>
